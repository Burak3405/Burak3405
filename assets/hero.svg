<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340">
  <defs>
    <style>
      .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 15px; }
      .prompt { fill: #E0C48C; font-weight: 700; }
      .cmd { fill: #E6EDF3; }
      .out { fill: #8B949E; }
      .hl { fill: #A78BFA; }
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #8B949E; }

      .cell { transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.34,1.56,.64,1) both; }
      .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s ease-in-out 2.6s infinite; }
      .float { animation: float 5s ease-in-out infinite; }
      .ring { transform-origin: 705px 165px; animation: spin 14s linear infinite; }
      .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }

      @keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
      @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.12); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
    </style>

    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0C48C"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#E0C48C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".35"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="face"><circle cx="705" cy="165" r="112"/></clipPath>

    <!-- typing reveal masks, one per line -->
    <clipPath id="l1"><rect x="25" y="62" width="0" height="24"><animate attributeName="width" from="0" to="520" begin="0.5s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="25" y="90" width="0" height="24"><set attributeName="width" to="520" begin="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="25" y="118" width="0" height="24"><animate attributeName="width" from="0" to="520" begin="1.9s" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="25" y="146" width="0" height="24"><set attributeName="width" to="520" begin="3.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="25" y="174" width="0" height="24"><animate attributeName="width" from="0" to="520" begin="3.9s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="25" y="202" width="0" height="24"><set attributeName="width" to="520" begin="5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="25" y="230" width="0" height="24"><animate attributeName="width" from="0" to="520" begin="5.7s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l8"><rect x="25" y="258" width="0" height="24"><set attributeName="width" to="520" begin="6.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="l9"><rect x="25" y="286" width="0" height="24"><set attributeName="width" to="520" begin="7.5s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- ============ TERMINAL ============ -->
  <rect x="10" y="10" width="540" height="320" rx="12" fill="#0D1117" stroke="#30363D"/>
  <path d="M10 22a12 12 0 0 1 12-12h516a12 12 0 0 1 12 12v20H10z" fill="#161B22"/>
  <line x1="10" y1="42" x2="550" y2="42" stroke="#30363D"/>
  <circle cx="30" cy="26" r="6" fill="#FF5F57"/>
  <circle cx="50" cy="26" r="6" fill="#FEBC2E"/>
  <circle cx="70" cy="26" r="6" fill="#28C840"/>
  <text x="280" y="30" text-anchor="middle" class="title">burak@github: ~</text>

  <g class="mono">
    <text x="30" y="80" clip-path="url(#l1)"><tspan class="prompt">❯ </tspan><tspan class="cmd">whoami</tspan></text>
    <text x="30" y="108" clip-path="url(#l2)" class="out">Burak — Software Engineering Student 🎓</text>

    <text x="30" y="136" clip-path="url(#l3)"><tspan class="prompt">❯ </tspan><tspan class="cmd">cat interests.txt</tspan></text>
    <text x="30" y="164" clip-path="url(#l4)" class="out"><tspan class="hl">algorithms</tspan> · <tspan class="hl">mathematics</tspan> · <tspan class="hl">architecture</tspan></text>

    <text x="30" y="192" clip-path="url(#l5)"><tspan class="prompt">❯ </tspan><tspan class="cmd">ls ~/hobbies</tspan></text>
    <text x="30" y="220" clip-path="url(#l6)" class="out">🎮 games/   📚 books/   🌍 travel/</text>

    <text x="30" y="248" clip-path="url(#l7)"><tspan class="prompt">❯ </tspan><tspan class="cmd">echo $MOTTO</tspan></text>
    <text x="30" y="276" clip-path="url(#l8)" class="out">"turning ideas into code, one commit at a time"</text>

    <text x="30" y="304" clip-path="url(#l9)"><tspan class="prompt">❯ </tspan></text>
  </g>
  <rect x="50" y="290" width="9" height="18" fill="#E0C48C" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" begin="7.5s" repeatCount="indefinite"/>
  </rect>

  <!-- ============ AVATAR ============ -->
  <circle cx="705" cy="165" r="150" fill="url(#glow)"/>
  <circle class="ring" cx="705" cy="165" r="126" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="520 272"/>

  <g class="float">
    <circle cx="705" cy="165" r="112" fill="#F0F0F0"/>
    <g clip-path="url(#face)" fill="#DEC98F">
      <!-- 5x5 identicon, cell = 40, grid origin (605, 65) -->
      <!-- row 0 : eyes -->
      <g class="eye"><rect class="cell" x="645" y="65" width="40" height="40" style="animation-delay:.15s"/></g>
      <g class="eye"><rect class="cell" x="725" y="65" width="40" height="40" style="animation-delay:.25s"/></g>
      <!-- row 1 -->
      <rect class="cell" x="605" y="105" width="40" height="40" style="animation-delay:.35s"/>
      <rect class="cell" x="685" y="105" width="40" height="40" style="animation-delay:.45s"/>
      <rect class="cell" x="765" y="105" width="40" height="40" style="animation-delay:.55s"/>
      <!-- row 2 -->
      <rect class="cell" x="645" y="145" width="40" height="40" style="animation-delay:.65s"/>
      <rect class="cell" x="685" y="145" width="40" height="40" style="animation-delay:.75s"/>
      <rect class="cell" x="725" y="145" width="40" height="40" style="animation-delay:.85s"/>
      <!-- row 4 : smile -->
      <rect class="cell" x="605" y="225" width="200" height="40" style="animation-delay:1.05s"/>
    </g>
  </g>

  <!-- sparkles -->
  <path class="spark" d="M590 60l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#E0C48C" style="animation-delay:.3s"/>
  <path class="spark" d="M832 95l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#A78BFA" style="animation-delay:1.1s"/>
  <path class="spark" d="M820 268l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#E0C48C" style="animation-delay:1.8s"/>
  <path class="spark" d="M585 262l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="#A78BFA" style="animation-delay:.8s"/>
</svg>
